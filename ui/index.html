<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>midnight-referendum</title>
    <!--
      Stamp the theme before first paint. The dark palette is keyed on
      data-theme alone, so without this a device set to dark would show the
      cream ground for one frame and then swap.
    -->
    <script>
      (() => {
        let stored = null;
        try {
          stored = window.localStorage.getItem('cico-theme');
        } catch {
          stored = null;
        }
        const prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const resolved =
          stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
        document.documentElement.dataset.theme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
