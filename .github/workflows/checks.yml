name: Format and lint

on:
  pull_request:
  push:
    branches:
      - main
      - feat/passport-credential-v2

jobs:
  checks:
    name: Biome checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run quality
