name: Test suite

on:
  pull_request:
  push:
    branches:
      - main
      - feat/passport-credential-v2

jobs:
  test:
    name: Compile, build, and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Compact developer tools
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh

      - name: Add Compact to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned Compact toolchain
        run: $HOME/.local/bin/compact update 0.31.1

      - name: Verify compile, build, and unit tests
        run: npm run verify:linux -- demo

  e2e:
    name: Headless browser journey
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run headless browser journey
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
